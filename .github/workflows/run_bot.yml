name: Bot 4H Hibrid Live

on:
  schedule:
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare biblioteci
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy xgboost scikit-learn requests

      - name: Rulare Bot Live
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
